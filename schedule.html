	<style>
        body, window {
            margin: 0;
            padding: 0;

            overflow-x: hidden;
            background-color: #EEE9C8;
        }
        p, span, div, h1, h2, h3, h4 {
            font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-size: 1.5rem;
        }

        a {
            text-decoration: none;
        }

        .link {
            text-decoration: underline;
            color: blue;

        }

        .link:hover {
            color: white
        }

        .bold {
            font-weight: bold;
        }

        .i {
            font-style: italic;
        }

        .underline {
            text-decoration: underline;
        }

        .col {
            display: flex;
            flex-direction: column;
        }

        .big {
            font-size: 4rem;
        }

        .styled {
            text-shadow: 2px 2px 0px rgb(109, 85, 71);
        }

        .info {
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;

            
            margin-top: 10vh;
            margin-bottom: 10vh;
            width: 100%;
            /*background-image: linear-gradient(to bottom, black, white);*/
        }
        .info-body {
            margin-left: 15vw;
            margin-right: 15vw;
        }
        
        .when-where {
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            align-items: center;
        }

        .lists {
            display: flex;
            flex-direction: row;
            justify-content: space-around;
        }

        .border {
            
            border: 1px solid black;
        }

        .poster {
            background-image: url("media/poster.jpeg");
            background-repeat: no-repeat;
            background-size: cover;

            width: 33.33%;
            aspect-ratio: 1126 / 2000;
        }

        .desktop { display: flex; }
        .mobile { display: none; }
        .row { display: flex; flex-direction: row; }
        .responsive-row { display: flex; flex-direction: row;}

        .poster1, .poster2, .poster3, .poster4 {
            background-repeat: no-repeat;
            background-size: cover;

            width: 100%;
            aspect-ratio: 1638 / 2048;
        }
        .poster1 { background-image: url("media/poster1.jpg"); }
        .poster2 { background-image: url("media/poster2.jpg"); }
        .poster3 { background-image: url("media/poster3.jpg"); }
        .poster4 { background-image: url("media/poster4.jpg"); }

        @media (max-width: 560px) {
            p, span, div, h1, h2, h3, h4 {
                font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
                font-size: 1rem;
            }

            .info {
                margin-top: 10vh;
            }

            .big {
                font-size: 4rem;
            }

            .poster {
                background-image: url("media/poster.jpeg");
                background-repeat: no-repeat;
                background-size: cover;

                width: 100%;
                aspect-ratio: 1126 / 2000;
            }

            .desktop { display: none; }
            .mobile { display: flex; }

            .lists {
                flex-direction: column;
            }

            .responsive-row { flex-direction: column;}
        }
